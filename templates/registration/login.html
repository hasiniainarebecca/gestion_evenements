{% extends 'base.html' %}

{% block title %}Connexion{% endblock %}

{% block content %}
<div class="mx-auto max-w-md">
  <div class="text-center">
    <p class="text-xs font-semibold uppercase tracking-[0.25em] text-gold-600">Espace membre</p>
    <h1 class="mt-2 text-3xl font-semibold text-brand-900 sm:text-4xl">Connexion</h1>
    <p class="mt-2 text-slate-600">Retrouvez vos inscriptions et réservez votre place.</p>
  </div>

  <form method="post" class="mt-8 overflow-hidden rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    {% include 'partials/form_fields.html' %}
    <button type="submit"
            class="inline-flex w-full items-center justify-center rounded-xl bg-brand-700 px-4 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-brand-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:ring-offset-2">Se connecter</button>
  </form>

  <p class="mt-6 text-center text-sm text-slate-600">
    Pas encore de compte ?
    <a href="{% url 'signup' %}" class="font-semibold text-brand-700 hover:text-brand-900">Créer un compte</a>
  </p>
</div>
{% endblock %}
