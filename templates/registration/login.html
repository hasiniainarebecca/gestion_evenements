{% extends 'base.html' %}

{% block title %}Connexion{% endblock %}

{% block content %}
<div class="mx-auto max-w-md">
  <h1 class="text-2xl font-bold text-slate-900 sm:text-3xl">Connexion</h1>
  <form method="post" class="mt-6 space-y-4 rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    {% include 'registration/_form_fields.html' %}
    <button type="submit" class="inline-flex items-center rounded-lg bg-brand-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-brand-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:ring-offset-2">Se connecter</button>
  </form>
  <p class="mt-4 text-sm text-slate-600">Pas encore de compte ? <a href="{% url 'signup' %}" class="font-semibold text-brand-600 hover:text-brand-700">Créer un compte</a></p>
</div>
{% endblock %}
