{% extends 'base.html' %}

{% block title %}Créer un compte{% endblock %}

{% block content %}
<div class="mx-auto max-w-md">
  <h1 class="text-2xl font-bold text-slate-900 sm:text-3xl">Créer un compte</h1>

  <form method="post" class="mt-6 rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
    {% csrf_token %}
    {% include 'partials/form_fields.html' %}
    <button type="submit"
            class="inline-flex w-full items-center justify-center rounded-lg bg-brand-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-brand-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:ring-offset-2">Créer mon compte</button>
  </form>

  <p class="mt-4 text-center text-sm text-slate-600">
    Déjà un compte ?
    <a href="{% url 'login' %}" class="font-medium text-brand-600 hover:text-brand-700">Se connecter</a>
  </p>
</div>
{% endblock %}
