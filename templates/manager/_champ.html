<label for="{{ champ.id_for_label }}" class="mb-1.5 block text-sm font-semibold text-brand-900">{{ champ.label }}</label>
{{ champ }}
{% if champ.help_text %}
  <p class="mt-1.5 text-xs leading-relaxed text-slate-500">{{ champ.help_text }}</p>
{% endif %}
{% for error in champ.errors %}
  <p class="mt-1.5 text-sm font-medium text-red-600">{{ error }}</p>
{% endfor %}
